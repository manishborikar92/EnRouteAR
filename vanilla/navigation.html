<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>EnRouteAR</title>

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">

    <!-- Fonts (same as index page) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Outfit:wght@400;500&display=swap" rel="stylesheet">

    <!-- A-Frame core -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- A-Frame look-at component -->
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <!-- AR.js location-based Three.js layer -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/three.js/build/ar-threex-location-only.js"></script>
    <!-- AR.js A-Frame integration -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet">

    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoicHJhbmtpdGEiLCJhIjoiY2xydnB6aXQzMHZqejJpdGV1NnByYW1kZyJ9.OedTGDqNQXNv-DJOV2HXuw';
    </script>

    <link rel="stylesheet" href="styles/navigation.css">
</head>
<body class="m-0 p-0 border-0 font-body overflow-hidden antialiased">

    <div class="flex flex-col h-screen w-full">

        <!-- Destination selector -->
        <div id="destination-select-container" class="absolute top-[2%] left-[1%] right-[1%] flex justify-between items-center gap-2 px-2.5 py-2 bg-[rgba(4,26,42,0.93)] border border-border rounded-[18px] text-text-1 shadow-[0_8px_32px_rgba(0,0,0,0.55)] z-5">
            <select id="select-destination" class="w-[calc(100%-130px)] px-3 py-2 bg-[rgba(0,0,0,0.40)] border border-border rounded-[8px] text-text-1 font-body text-[0.9rem] appearance-none cursor-pointer outline-none overflow-hidden text-ellipsis whitespace-nowrap transition-[border-color,box-shadow] duration-[220ms] ease-custom focus:border-primary focus:shadow-[0_0_0_3px_rgba(0,180,255,0.15)] z-5">
                <option value="example">Select Destination</option>
            </select>
            <button id="get-direction-button" class="w-[120px] py-[9px] shrink-0 bg-gradient-to-br from-primary to-primary-dk border-none rounded-[8px] text-white font-display text-[0.62rem] font-bold tracking-[0.1em] text-center cursor-pointer transition-[box-shadow,transform] duration-[220ms] ease-custom hover:shadow-[0_0_20px_rgba(0,180,255,0.5)] hover:-translate-y-px active:translate-y-0 z-5">Navigate</button>
        </div>

        <!-- AR scene -->
        <!--
            renderer="alpha: true" — canvas is transparent so the camera video
            shows through it from behind. This replaces videoTexture:true which
            hides the video element, causing Android Chrome to suspend it.
        -->
        <a-scene
            loading-screen="enabled: false"
            renderer="alpha: true; logarithmicDepthBuffer: true;"
            cursor="rayOrigin: mouse; fuse: true; fuseTimeout: 0;"
            raycaster="objects: [gps-new-entity-place];"
            vr-mode-ui="enabled: false"
            embedded
            arjs="sourceType: webcam; sourceWidth: 1920; sourceHeight: 1080; displayWidth: 100%; displayHeight: 100%; debugUIEnabled: false;">
            <a-camera gps-new-camera="minDistance: 10;" rotation-reader></a-camera>
        </a-scene>

        <!-- Compass -->
        <div id="compass-container"></div>

        <!-- 2D map -->
        <div id="map-container" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full h-[180px] border-t border-border shadow-[0_-8px_32px_rgba(0,0,0,0.5)] z-2">
            <div id="map" class="w-full h-full"></div>
        </div>

        <!-- Multifunction button -->
        <div id="multifunction-container" class="absolute bottom-[190px] right-3 w-[46px] h-[46px] rounded-full origin-center z-3">
            <button id="multifunction-button" class="multifunction-button w-full h-full flex justify-center items-center p-0 bg-[rgba(4,26,42,0.93)] border border-border rounded-full cursor-pointer shadow-[0_4px_16px_rgba(0,0,0,0.4)] transition-[border-color,box-shadow,transform] duration-[220ms] ease-custom hover:border-border-hi hover:shadow-[0_0_18px_rgba(0,180,255,0.25)] hover:scale-[1.06] active:scale-[0.97]">
                <img id="centeredImage" alt="Multifunction Icon" class="w-[62%] h-[62%] object-contain brightness-[1.15]">
            </button>
        </div>

    </div>

    <script src="scripts/places.js"></script>
    <script src="scripts/script.js"></script>

</body>
</html>
