<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>EnRouteAR</title>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
        
    <!-- A-Frame itself -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <!-- Pure three.js code that the A-Frame components use for location-based AR -->
    <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/master/three.js/build/ar-threex-location-only.js'></script>

    <!-- AR.js A-Frame components -->
    <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js'></script>
    
    <!-- Mapbox script tags -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css' rel='stylesheet' />

    <script>
        // Set the Mapbox access token
        mapboxgl.accessToken = config.mapboxAccessToken;;
    </script>
    
    <link rel="stylesheet" href="styles/navigation-mini.css">
</head>
<body style="margin: 0; overflow: hidden;">
    <div class="container">
        <div id="destination-select-container">
            <select id="select-destination">
                <option value="example">Select Destination</option>
                <!-- Add more destination options here -->
            </select>
            <button id="get-direction-button">Get Directions</button>
        </div>
        <a-scene cursor="rayOrigin: mouse; fuse: true; fuseTimeout: 0;" raycaster="objects: [gps-new-entity-place];" vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; sourceWidth: 1920; sourceHeight: 1080; displayWidth: 100%; displayHeight: 100%; debugUIEnabled: false;">
            <a-camera gps-new-camera="minDistance: 10; videoTexture: true;" rotation-reader></a-camera>
            
            <!-- This entity will be dynamically added for the selected destination -->
            <!-- Adjust attributes and styling based on your preferences -->
            <!-- This entity will look at the camera and be placed at the selected destination -->
            <!-- Scale and position can be adjusted based on your AR scene requirements -->
            <!-- The id 'ar-destination-label' is used for later identification/removal -->
        </a-scene>
        
        <!-- Container for the compass -->
        <div id="compass-container"></div>

        <!-- Container for the 2D map -->
        <div id="map-container">
            <div id="map"></div>
        </div>

        <!-- Add a container for the custom recenter button -->
    <div id="multifunction-container">
        <!-- Use an image as the button -->
        <button id="multifunction-button" class="multifunction-button">
            <img id="centeredImage" alt="Multifunction Icon">
        </button>
    </div>

    </div>
    <script src="scripts/places.js"></script>
    <script src="scripts/script.js"></script>
</body>
</html>
